name: Fast Keyboard Nova Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK with dependency retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if [ "$attempt" -eq 1 ]; then
              gradle :app:assembleDebug --no-daemon --stacktrace
            else
              gradle :app:assembleDebug --no-daemon --stacktrace --refresh-dependencies
            fi
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "Gradle build failed on attempt ${attempt} (status ${status}). Retrying..."
            sleep 10
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastKeyboard-Nova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
